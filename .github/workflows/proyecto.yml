name: Generar borrador ADS7824

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  generar-borrador:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Verificar proyecto
        run: |
          echo "Proyecto: ADS7824"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

          test -f Readme.md
          test -f codigo/ADS7824/ADS7824.ino
          test -f mediciones/mediciones_01.md

          echo "Proyecto verificado correctamente"

      - name: Generar artículo con IA
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const read = (file) => fs.existsSync(file)
            ? fs.readFileSync(file, 'utf8')
            : '(Archivo no disponible)';

          const readme = read('Readme.md');
          const codigo = read('codigo/ADS7824/ADS7824.ino');
          const mediciones = read('mediciones/mediciones_01.md');

          const prompt = `
          Actúa como redactor técnico especializado en electrónica,
          instrumentación y adquisición de datos.

          Genera un artículo técnico en español para el proyecto ADS7824
          con Arduino Mega 2560.

          IMPORTANTE:
          - Utiliza exclusivamente la información proporcionada abajo.
          - No inventes mediciones, componentes, conexiones ni resultados.
          - Conserva exactamente los valores numéricos de las mediciones.
          - Si existe una incertidumbre o un dato que necesita verificarse,
            indícalo explícitamente.
          - Organiza el texto en Markdown.
          - Incluye: objetivo, hardware, conexiones, funcionamiento,
            software, mediciones experimentales, análisis y próximos pasos.
          - El texto debe ser técnico, claro y adecuado para un blog de
            laboratorio electrónico como SIEE Lab.
          - No presentes como conclusión definitiva algo que los datos
            todavía no permitan confirmar.

          ==================== README ====================
          ${readme}

          ==================== CÓDIGO ====================
          ${codigo}

          ==================== MEDICIONES ====================
          ${mediciones}
          `;

          async function main() {
            if (!process.env.OPENAI_API_KEY) {
              throw new Error('OPENAI_API_KEY no está configurada');
            }

            const response = await fetch('https://api.openai.com/v1/responses', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`
              },
              body: JSON.stringify({
                model: 'gpt-5.6-luna',
                input: prompt
              })
            });

            if (!response.ok) {
              const errorText = await response.text();
              throw new Error(`OpenAI API ${response.status}: ${errorText}`);
            }

            const data = await response.json();

            const text = data.output
              ?.filter(item => item.type === 'message')
              ?.flatMap(item => item.content || [])
              ?.filter(item => item.type === 'output_text')
              ?.map(item => item.text)
              ?.join('\n');

            if (!text) {
              throw new Error('La API no devolvió texto de salida');
            }

            fs.mkdirSync('documentacion', { recursive: true });

            fs.writeFileSync(
              'documentacion/articulo_IA.md',
              text,
              'utf8'
            );

            console.log('Artículo generado correctamente:');
            console.log(text);
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Guardar artículo generado
        uses: actions/upload-artifact@v4
        with:
          name: borrador-ADS7824-IA
          path: documentacion/articulo_IA.md
