      - name: Crear borrador del artículo
        run: |
          mkdir -p documentacion

          cat > documentacion/articulo.md <<'EOF'
          # ADS7824 con Arduino Mega

          ## Introducción

          Proyecto experimental para estudiar el funcionamiento del ADC ADS7824
          utilizando un Arduino Mega 2560.

          ## Hardware utilizado

          - ADS7824P
          - Arduino Mega 2560
          - Bus paralelo de 8 bits
          - Capacitores de referencia y filtrado

          ## Conexiones

          El bus de datos D0-D7 del ADS7824 está conectado al puerto A
          del Arduino Mega.

          ## Software

          El Arduino realiza la conversión y transmite los resultados
          mediante el puerto serie a 115200 baudios.

          ## Mediciones experimentales

          EOF

          cat mediciones/mediciones_01.md >> documentacion/articulo.md

          cat >> documentacion/articulo.md <<'EOF'

          ## Conclusiones

          Los resultados anteriores forman parte de las primeras pruebas
          experimentales del ADS7824.

          Documento generado automáticamente como borrador.
          EOF

          echo "Borrador generado:"
          cat documentacion/articulo.md
      - name: Guardar borrador
        uses: actions/upload-artifact@v4
        with:
          name: borrador-ADS7824
          path: documentacion/articulo.md